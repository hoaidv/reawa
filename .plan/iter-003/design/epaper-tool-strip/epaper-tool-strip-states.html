<!DOCTYPE html>
<html lang="en" data-platform="epaper">
<head>
  <meta charset="utf-8" />
  <title>Epaper — tool chip states</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    body { height: auto; min-height: 100%; padding: 16px; background: #e4e4e7; }
    h1 { font-size: 16px; }
    .c-tool-chip { position: static; transform: none; display: inline-flex; margin: 8px 0; }
    .c-tool-btn:active { background: #000; color: #fff; }
    .c-tool-btn:active img { filter: invert(1); }
    .note { font-size: 12px; max-width: 28rem; }
  </style>
</head>
<body data-state="states">
  <h1>Floating chip 32px — default / active / pressed / unavailable</h1>
  <div class="c-tool-chip" role="toolbar">
    <button type="button" class="c-tool-btn" aria-label="Selection" aria-pressed="false"><img src="../system/assets/icon-epaper-selection.svg" alt="" /></button>
    <button type="button" class="c-tool-btn" aria-label="Pen" aria-pressed="true"><img src="../system/assets/icon-epaper-pen.svg" alt="" /></button>
    <button type="button" class="c-tool-btn" aria-label="Ink box" disabled><img src="../system/assets/icon-epaper-ink-box.svg" alt="" /></button>
  </div>
  <p class="note">Height fixed at 32px (icon-only). Not a full-width band. Press for :active.</p>
</body>
</html>
