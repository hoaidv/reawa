<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>epaper-tool-strip — scene navigator</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f5; }
    .nav-shell { display: flex; min-height: 100vh; }
    .nav-side {
      width: 15rem; flex-shrink: 0; padding: 1rem;
      border-right: 1px solid #d4d4d8; background: #fff;
    }
    .nav-side strong { display: block; margin-bottom: 0.75rem; font-size: 14px; }
    .nav-side a {
      display: block; padding: 0.4rem 0.5rem; margin: 0.1rem 0;
      border-radius: 0.35rem; color: inherit; text-decoration: none; font-size: 12px;
    }
    .nav-side a:hover, .nav-side a:focus-visible { background: #e4e4e7; outline: none; }
    .nav-side a[aria-current="page"] { background: #e4e4e7; font-weight: 600; }
    .nav-main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 1rem; min-width: 0; }
    .hint { align-self: stretch; margin: 0 0 0.75rem; font-size: 0.875rem; color: #52525b; }
    .preview-stage { display: flex; justify-content: center; width: 100%; }
    .preview-scale {
      position: relative;
      transform-origin: top center;
      background: #fff;
      box-shadow: 0 1px 8px rgb(0 0 0 / 12%);
    }
    .preview-scale iframe {
      position: absolute; inset: 0;
      display: block; border: 0; width: 100%; height: 100%;
      background: #52525b;
    }
    /* RM2 landscape 1872×1404 — tablet horizontal @ 100% */
    .preview-stage[data-preview-scale="tablet"] .preview-scale {
      width: min(1120px, 100%);
      aspect-ratio: 1872 / 1404;
      transform: none;
      border-radius: 0.5rem;
      overflow: hidden;
      border: 1px solid #a1a1aa;
    }
  </style>
</head>
<body>
  <div class="nav-shell" data-platform="epaper">
    <nav class="nav-side" aria-label="Scenes">
      <strong>epaper-tool-strip</strong>
      <a href="./epaper-tool-strip-pen.html" target="scene-preview" aria-current="page">tool.pen (primary)</a>
      <a href="./epaper-tool-strip-ink-box.html" target="scene-preview">tool.ink_box</a>
      <a href="./epaper-tool-strip-selection-idle.html" target="scene-preview">selection.idle</a>
      <a href="./epaper-tool-strip-selection-selected.html" target="scene-preview">selection.selected</a>
      <a href="./epaper-tool-strip-selection-dragging.html" target="scene-preview">selection.dragging</a>
      <a href="./epaper-tool-strip-selection-empty.html" target="scene-preview">selection.empty</a>
      <a href="./epaper-tool-strip-session-down.html" target="scene-preview">session.down</a>
      <a href="./epaper-tool-strip-touch-unavailable.html" target="scene-preview">touch.unavailable</a>
      <a href="./epaper-tool-strip-orient-gut-on-top.html" target="scene-preview">orient.gutOnTop</a>
      <a href="./epaper-tool-strip-states.html" target="scene-preview">States showcase</a>
    </nav>
    <main class="nav-main">
      <p class="hint">
        RM2 landscape tablet preview (1872×1404) · chip 32px · UI-EP-01 v0.3 · float at orientation-top (CHL-0003).
      </p>
      <div class="preview-stage" data-preview-scale="tablet">
        <div class="preview-scale">
          <iframe name="scene-preview" title="Scene preview" src="./epaper-tool-strip-pen.html"></iframe>
        </div>
      </div>
    </main>
  </div>
  <script>
    document.querySelectorAll('.nav-side a[target="scene-preview"]').forEach((a) => {
      a.addEventListener("click", () => {
        document.querySelectorAll(".nav-side a").forEach((l) => l.removeAttribute("aria-current"));
        a.setAttribute("aria-current", "page");
      });
    });
  </script>
</body>
</html>
