<!DOCTYPE html>
<html lang="en" data-platform="epaper">
<head>
  <meta charset="utf-8" />
  <title>InkScaleModeToggle — self-contained</title>
  <style>
    :root { --color-paper: #ffffff; --color-ink: #000000; }
    body { margin: 1rem; font-family: system-ui, sans-serif; background: #ddd; }
    .c-mode-toggle {
      display: inline-flex; align-items: center; gap: 6px; height: 36px;
      padding: 0 8px 0 4px; border: 2px solid var(--color-ink);
      background: repeating-linear-gradient(-45deg, #fff, #fff 3px, #000 3px, #000 4px);
      font-size: 12px; cursor: none; -webkit-tap-highlight-color: transparent;
    }
    .c-mode-toggle img {
      width: 20px; height: 20px; background: #fff; border: 1px solid #000;
    }
    .c-mode-current {
      background: #fff; border: 1px solid #000; padding: 2px 6px; white-space: nowrap;
    }
    .c-mode-toggle:active, .c-mode-toggle.is-pressed {
      background: #000; color: #fff;
    }
    .c-mode-toggle:active img, .c-mode-toggle.is-pressed img { filter: invert(1); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    .note { font-size: 12px; }
  </style>
</head>
<body>
  <p class="note">Lives on the selected box. Hatch fill vs ink strokes. Press inverts. Hover/focus N/A.</p>
  <div class="row">
    <button type="button" class="c-mode-toggle" id="tgl.ink_scale_mode" data-interactive data-mode="withBounds" aria-pressed="true">
      <img src="../../system/assets/icon-epaper-mode-with-bounds.svg" alt="" />
      <span class="c-mode-current" id="ind.mode_current">Scale ink</span>
    </button>
    <button type="button" class="c-mode-toggle" data-interactive data-mode="fixedInk" aria-pressed="false">
      <img src="../../system/assets/icon-epaper-mode-fixed-ink.svg" alt="" />
      <span class="c-mode-current">Keep size</span>
    </button>
    <button type="button" class="c-mode-toggle is-pressed" data-interactive>
      <img src="../../system/assets/icon-epaper-mode-with-bounds.svg" alt="" />
      <span class="c-mode-current">Scale ink</span>
    </button>
  </div>
  <script>
    document.querySelectorAll("[data-interactive]").forEach((el) => {
      el.addEventListener("pointerdown", () => el.classList.add("is-pressed"));
      ["pointerup", "pointerleave", "blur"].forEach((ev) => {
        el.addEventListener(ev, () => el.classList.remove("is-pressed"));
      });
    });
  </script>
</body>
</html>
