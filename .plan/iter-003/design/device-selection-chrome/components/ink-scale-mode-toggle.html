<!DOCTYPE html>
<html lang="en" data-platform="epaper">
<head>
  <meta charset="utf-8" />
  <title>InkScaleModeToggle — self-contained</title>
  <style>
    :root {
      --color-paper: #ffffff;
      --color-ink: #000000;
      --chip-btn: 10mm;
      --chip-icon: 4mm;
      --chip-radius: 0;
    }
    body { margin: 1rem; font-family: system-ui, sans-serif; background: #ddd; }
    .c-mode-toggle {
      box-sizing: border-box;
      display: flex; align-items: center; justify-content: center;
      width: var(--chip-btn); height: var(--chip-btn);
      padding: 0; border: 1px solid var(--color-ink);
      border-radius: var(--chip-radius);
      background: var(--color-paper);
      cursor: none; -webkit-tap-highlight-color: transparent;
    }
    .c-mode-toggle img {
      width: var(--chip-icon); height: var(--chip-icon);
      background: transparent; border: 0;
    }
    .c-mode-current {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .c-mode-toggle:active, .c-mode-toggle.is-pressed, .c-mode-toggle[aria-pressed="true"] {
      background: var(--color-ink); color: var(--color-paper);
    }
    .c-mode-toggle:active img, .c-mode-toggle.is-pressed img, .c-mode-toggle[aria-pressed="true"] img { filter: invert(1); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
    .note { font-size: 12px; }
  </style>
</head>
<body>
  <p class="note">Icon-only. Size = primary ToolChip tile (10 mm). Press inverts. Hover/focus N/A.</p>
  <div class="row">
    <button type="button" class="c-mode-toggle" id="tgl.ink_scale_mode" data-interactive data-mode="withBounds" aria-pressed="true" aria-label="Scale ink">
      <img src="../../system/assets/icon-epaper-mode-with-bounds.svg" alt="" />
      <span class="c-mode-current">Scale ink</span>
    </button>
    <button type="button" class="c-mode-toggle" data-interactive data-mode="fixedInk" aria-pressed="false" aria-label="Keep size">
      <img src="../../system/assets/icon-epaper-mode-fixed-ink.svg" alt="" />
      <span class="c-mode-current">Keep size</span>
    </button>
    <button type="button" class="c-mode-toggle is-pressed" data-interactive aria-label="Scale ink">
      <img src="../../system/assets/icon-epaper-mode-with-bounds.svg" alt="" />
      <span class="c-mode-current">Scale ink</span>
    </button>
  </div>
  <script>
    document.querySelectorAll("[data-interactive]").forEach((el) => {
      el.addEventListener("pointerdown", () => el.classList.add("is-pressed"));
      ["pointerup", "pointerleave", "blur"].forEach((ev) => {
        el.addEventListener(ev, () => el.classList.remove("is-pressed"));
      });
    });
  </script>
</body>
</html>
