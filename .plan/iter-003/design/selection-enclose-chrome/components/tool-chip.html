<!DOCTYPE html>
<html lang="en" data-platform="epaper">
<head>
  <meta charset="utf-8" />
  <title>ToolChip — composed from UI-EP-01</title>
  <style>
    :root {
      --color-paper: #ffffff;
      --color-ink: #000000;
      --chip-btn: 10mm;
      --chip-icon: 4mm;
      --chip-radius: 0;
    }
    body { margin: 1rem; font-family: system-ui, sans-serif; background: #ddd; }
    .c-tool-chip {
      display: inline-flex; gap: 0; height: auto; padding: 0;
      border: 1px solid var(--color-ink); border-radius: var(--chip-radius);
      background: var(--color-paper); overflow: hidden;
    }
    .c-tool-btn {
      box-sizing: border-box;
      width: var(--chip-btn); height: var(--chip-btn); aspect-ratio: 1;
      border: 0; border-right: 1px solid var(--color-ink); border-radius: 0;
      background: var(--color-paper);
      display: flex; align-items: center; justify-content: center;
      font-size: 0; cursor: none; padding: 0; margin: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .c-tool-btn:last-child { border-right: 0; }
    .c-tool-btn img { width: var(--chip-icon); height: var(--chip-icon); pointer-events: none; }
    .c-tool-btn[aria-pressed="true"] { background: var(--color-ink); }
    .c-tool-btn[aria-pressed="true"] img { filter: invert(1); }
    .c-tool-btn:active, .c-tool-btn.is-pressed { background: var(--color-ink); }
    .c-tool-btn:active img, .c-tool-btn.is-pressed img { filter: invert(1); }
    .c-tool-btn:disabled {
      background: repeating-linear-gradient(-45deg, #fff, #fff 2px, #000 2px, #000 3px);
    }
    .note { font-size: 12px; max-width: 28rem; }
  </style>
</head>
<body>
  <p class="note">Composed from UI-EP-01 — 64×64 squared tiles, radius 0, three tools. Not redesigned. No undo / Smart Group slot.</p>
  <div class="c-tool-chip" data-region="ToolStrip" role="toolbar" aria-label="Tools">
      <button type="button" class="c-tool-btn" data-interactive id="tool.sel_rect" aria-pressed="false" aria-label="Selection rect"><img src="../../system/assets/icon-epaper-sel-rect.svg" alt="" /></button>
      <button type="button" class="c-tool-btn" data-interactive id="tool.sel_freeform" aria-pressed="false" aria-label="Selection freeform"><img src="../../system/assets/icon-epaper-sel-freeform.svg" alt="" /></button>
      <button type="button" class="c-tool-btn" data-interactive id="tool.pen" aria-pressed="true" aria-label="Pen"><img src="../../system/assets/icon-epaper-pen.svg" alt="" /></button>
      <button type="button" class="c-tool-btn" data-interactive id="tool.ink_box" aria-pressed="false" aria-label="Ink box"><img src="../../system/assets/icon-epaper-ink-box.svg" alt="" /></button>
    </div>
  <script>
    document.querySelectorAll("[data-interactive]").forEach((el) => {
      el.addEventListener("pointerdown", () => el.classList.add("is-pressed"));
      ["pointerup", "pointerleave", "blur"].forEach((ev) => {
        el.addEventListener(ev, () => el.classList.remove("is-pressed"));
      });
    });
  </script>
</body>
</html>
