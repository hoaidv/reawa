<!DOCTYPE html>
<html lang="en" data-platform="epaper">
<head>

  <title>Marquee — self-contained</title>
  <style>
    body { margin: 1rem; font-family: system-ui; background: #ddd; }

      position: relative; width: 220px; height: 140px;
      border: 1px dotted #000; background: transparent;
    }

</head>
<body>
  <p>ovl.marquee — 1 px dotted; follows pen tip. Not ink.</p>
