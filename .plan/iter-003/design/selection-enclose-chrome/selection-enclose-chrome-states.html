<!DOCTYPE html>
<html lang="en" data-platform="epaper">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>States showcase — selection enclose chrome</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    html, body { overflow: auto; height: auto; background: #fff; }
    .show { padding: 16px; display: grid; gap: 24px; }
    .show h1 { font-size: 14px; margin: 0; }
    .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
    .lab { font-size: 11px; margin-bottom: 4px; }
    .c-enclose:active, .c-enclose.is-pressed { background: #000; color: #fff; }
    .c-tool-btn:active, .c-tool-btn.is-pressed { background: #000; }
  </style>
</head>
<body>
  <div class="show">
    <h1>UI-EP-03 control states (press invert; no hover)</h1>
    <div>
      <div class="lab">ToolChip default / Selection pressed / Pen / Ink-box</div>
      <div class="c-tool-chip" role="toolbar" aria-label="Tools" style="position:relative;transform:none;left:auto;top:auto;">
        <button type="button" class="c-tool-btn" data-interactive aria-pressed="true" aria-label="Selection"><img src="../system/assets/icon-epaper-selection.svg" alt="" /></button>
        <button type="button" class="c-tool-btn" data-interactive aria-pressed="false" aria-label="Pen"><img src="../system/assets/icon-epaper-pen.svg" alt="" /></button>
        <button type="button" class="c-tool-btn" data-interactive aria-pressed="false" aria-label="Ink box"><img src="../system/assets/icon-epaper-ink-box.svg" alt="" /></button>
      </div>
    </div>
    <div>
      <div class="lab">ovl.marquee</div>
      <div class="c-marquee" style="position:relative;width:180px;height:100px;"></div>
    </div>
    <div>
      <div class="lab">ovl.nodes_bounds + 6 anchors</div>
      <div class="c-nodes-bounds" style="position:relative;width:200px;height:120px;">
        <span class="c-select-anchor nw"></span>
        <span class="c-select-anchor n"></span>
        <span class="c-select-anchor ne"></span>
        <span class="c-select-anchor sw"></span>
        <span class="c-select-anchor s"></span>
        <span class="c-select-anchor se"></span>
      </div>
    </div>
    <div>
      <div class="lab">cta.enclose default / press (icon-only 64×64, no toolbar)</div>
      <div class="row">
        <button type="button" class="c-enclose" data-interactive aria-label="Enclose" style="position:relative;left:auto;top:auto;transform:none;">
          <img src="../system/assets/icon-epaper-enclose.svg" alt="" />
        </button>
        <button type="button" class="c-enclose is-pressed" aria-label="Enclose pressed" style="position:relative;left:auto;top:auto;transform:none;">
          <img src="../system/assets/icon-epaper-enclose.svg" alt="" />
        </button>
      </div>
    </div>
    <div>
      <div class="lab">ind.create_refused_no_surround</div>
      <div class="c-indicator" role="status" style="position:relative;">
        <img src="../system/assets/icon-epaper-refused.svg" alt="" />
        <span class="c-indicator__copy">No surrounding stroke</span>
      </div>
    </div>
  </div>
  <script>
    document.querySelectorAll("[data-interactive]").forEach((el) => {
      el.addEventListener("pointerdown", () => el.classList.add("is-pressed"));
      ["pointerup", "pointerleave", "blur"].forEach((ev) => el.addEventListener(ev, () => el.classList.remove("is-pressed")));
    });
  </script>
</body>
</html>
