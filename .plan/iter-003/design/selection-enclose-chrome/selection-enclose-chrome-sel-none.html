<!DOCTYPE html>
<html lang="en" data-platform="epaper">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sel.none — selection enclose chrome</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    .c-tool-btn:active, .c-enclose:active { background: #000; color: #fff; }
    .c-tool-btn:active img { filter: invert(1); }
  </style>
</head>
<body data-state="sel.none">
  <div data-region="DeviceScreen" data-orientation="gutToLeft">
    <a class="hop-canvas" href="./selection-enclose-chrome-sel-marquee.html" aria-label="Start marquee"></a>
    <div data-region="InkSurface">
      <div class="ink-cluster scatter-nodes">
        <svg viewBox="18 16 266 178" aria-hidden="true">
          <path class="ink-boundary" d="M20 20 L 280 28 L 270 190 L 30 180 Z"/>
          <path class="ink-stroke" d="M48 72c40-14 70 8 120-4 38-9 70 8 90-2"/>
          <path class="ink-stroke" d="M52 108c55 10 90-16 150 4"/>
          <path class="ink-stroke" d="M46 144c48-8 96 14 148-2"/>
        </svg>
      </div>
      <div data-region="SelectionOverlay" class="is-hidden" hidden></div>
      <p class="scene-caption">sel.none — Selection armed; overlay hidden.
        <a href="./selection-enclose-chrome-sel-marquee.html">Drag marquee</a>
      </p>
      <span class="orient-tag">orient: gutToLeft</span>
    </div>
    <div class="c-tool-chip" data-region="ToolStrip" role="toolbar" aria-label="Tools">
      <button type="button" class="c-tool-btn" data-interactive aria-pressed="true" aria-label="Selection"><img src="../system/assets/icon-epaper-selection.svg" alt="" /></button>
      <button type="button" class="c-tool-btn" data-interactive aria-pressed="false" aria-label="Pen"><img src="../system/assets/icon-epaper-pen.svg" alt="" /></button>
      <button type="button" class="c-tool-btn" data-interactive aria-pressed="false" aria-label="Ink box"><img src="../system/assets/icon-epaper-ink-box.svg" alt="" /></button>
    </div>
    <p data-region="StatusLine">sel.none · 3 tools</p>
  </div>
  <script>
    document.querySelectorAll("[data-interactive]").forEach((el) => {
      el.addEventListener("pointerdown", () => el.classList.add("is-pressed"));
      ["pointerup", "pointerleave", "blur"].forEach((ev) => el.addEventListener(ev, () => el.classList.remove("is-pressed")));
    });
  </script>
</body>
</html>
