<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>selection-enclose-chrome — scene navigator</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f5; }
    .nav-shell { display: flex; min-height: 100vh; }
    .nav-side {
      width: 16rem; flex-shrink: 0; padding: 1rem;
      border-right: 1px solid #d4d4d8; background: #fff;
    }
    .nav-side strong { display: block; margin-bottom: 0.75rem; font-size: 14px; }
    .nav-side a {
      display: block; padding: 0.4rem 0.5rem; margin: 0.1rem 0;
      border-radius: 0.35rem; color: inherit; text-decoration: none; font-size: 12px;
    }
    .nav-side a:hover, .nav-side a:focus-visible { background: #e4e4e7; outline: none; }
    .nav-side a[aria-current="page"] { background: #e4e4e7; font-weight: 600; }
    .nav-main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 1rem; min-width: 0; }
    .hint { align-self: stretch; margin: 0 0 0.75rem; font-size: 0.875rem; color: #52525b; }

    .nav-main { flex: 1; display: flex; flex-direction: column; align-items: flex-start; padding: 1rem; min-width: 0; overflow: auto; }
    .preview-stage { display: block; width: auto; overflow: auto; }
    .preview-scale {
      position: relative;
      width: 246mm;
      height: 187mm;
      flex-shrink: 0;
      transform: none;
      background: #fff;
      box-shadow: 0 1px 8px rgb(0 0 0 / 12%);
      border: 1px solid #a1a1aa;
      overflow: hidden;
    }
    .preview-scale iframe {
      position: absolute; inset: 0;
      display: block; border: 0; width: 100%; height: 100%;
      background: #52525b;
    }
    .preview-stage[data-preview-scale] .preview-scale {
      width: 246mm;
      height: 187mm;
      transform: none;
      aspect-ratio: auto;
    }
</style>
</head>
<body>
  <div class="nav-shell" data-platform="epaper">
    <nav class="nav-side" aria-label="Scenes">
      <strong>selection-enclose-chrome</strong>
      <a href="./selection-enclose-chrome-sel-none.html" target="scene-preview">sel.none</a>
      <a href="./selection-enclose-chrome-sel-marquee.html" target="scene-preview">sel.marquee (rect)</a>
      <a href="./selection-enclose-chrome-sel-lasso.html" target="scene-preview">sel.lasso (freeform)</a>
      <a href="./selection-enclose-chrome-sel-nodes-selected.html" target="scene-preview" aria-current="page">sel.nodes_selected (primary)</a>
      <a href="./selection-enclose-chrome-sel-create-refused.html" target="scene-preview">sel.create_refused</a>
      <a href="./selection-enclose-chrome-states.html" target="scene-preview">States showcase</a>
    </nav>
    <main class="nav-main">
      <p class="hint">
        RM2 landscape 246×187 mm (1872×1404) · 1 cm tiles · real size, no parent scale. </p>
      <div class="preview-stage" data-preview-scale="tablet">
        <div class="preview-scale">
          <iframe name="scene-preview" title="Scene preview" src="./selection-enclose-chrome-sel-nodes-selected.html"></iframe>
        </div>
      </div>
    </main>
  </div>
  <script>
    document.querySelectorAll('.nav-side a[target="scene-preview"]').forEach((a) => {
      a.addEventListener("click", () => {
        document.querySelectorAll(".nav-side a").forEach((l) => l.removeAttribute("aria-current"));
        a.setAttribute("aria-current", "page");
      });
    });
  </script>
</body>
</html>
