<!DOCTYPE html>
<html lang="en" data-platform="desktop">
<head>
  <meta charset="utf-8" />
  <title>ToolStrip — self-contained</title>
  <style>
    :root {
      --color-ink: #1c2430; --color-primary: #0f766e; --color-chrome: rgba(255,255,255,.92);
      --color-border: #d0d5dd; --radius-control: 6px; --space-xs: 4px; --space-md: 16px;
    }
    body { margin: 2rem; font-family: system-ui, sans-serif; background: #f2f4f7; }
    .c-tool-strip {
      display: inline-flex; flex-direction: column; gap: var(--space-xs); padding: var(--space-xs);
      background: var(--color-chrome); border: 1px solid var(--color-border); border-radius: var(--radius-control);
    }
    .c-tool-btn {
      display: flex; flex-direction: column; align-items: center; gap: 2px; width: 3rem; min-height: 3rem;
      border: 1px solid transparent; border-radius: var(--radius-control); background: transparent; cursor: pointer; font-size: 10px;
    }
    .c-tool-btn img { width: 20px; height: 20px; }
    .c-tool-btn:hover { background: rgba(15,118,110,.08); }
    .c-tool-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--color-primary); }
    .c-tool-btn:active { background: rgba(15,118,110,.16); }
    .c-tool-btn[aria-pressed="true"] { background: rgba(15,118,110,.14); border-color: var(--color-primary); color: var(--color-primary); font-weight: 600; }
  </style>
</head>
<body>
  <div class="c-tool-strip" data-region="ToolStrip" role="toolbar" aria-label="Ink-box tools">
    <button type="button" class="c-tool-btn" id="tool.selection" aria-pressed="true">
      <img src="../../system/assets/icon-tool-selection.svg" alt="" />
      Select
    </button>
    <button type="button" class="c-tool-btn" id="tool.ink_box" aria-pressed="false">
      <img src="../../system/assets/icon-tool-ink-box.svg" alt="" />
      Ink-box
    </button>
  </div>
  <script>
    document.querySelectorAll(".c-tool-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".c-tool-btn").forEach((b) => b.setAttribute("aria-pressed", "false"));
        btn.setAttribute("aria-pressed", "true");
      });
    });
  </script>
</body>
</html>
