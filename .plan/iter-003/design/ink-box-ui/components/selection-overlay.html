<!DOCTYPE html>
<html lang="en" data-platform="desktop">
<head>
  <meta charset="utf-8" />
  <title>SelectionOverlay — self-contained</title>
  <style>
    :root { --color-primary: #0f766e; --color-surface-elevated: #fff; }
    body { margin: 2rem; background: #f2f4f7; font-family: system-ui, sans-serif; }
    .demo { position: relative; width: 280px; height: 160px; background: #e8ebf0; }
    .c-bounds { position: absolute; left: 40px; top: 30px; width: 180px; height: 90px; border: 1.5px solid var(--color-primary); }
    .c-handle {
      position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px;
      background: var(--color-surface-elevated); border: 1.5px solid var(--color-primary); cursor: nwse-resize;
    }
    .c-handle:hover, .c-handle:active { background: var(--color-primary); }
    .c-handle:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--color-primary); }
    .nw { left: 0; top: 0; } .ne { left: 100%; top: 0; cursor: nesw-resize; }
    .sw { left: 0; top: 100%; cursor: nesw-resize; } .se { left: 100%; top: 100%; }
  </style>
</head>
<body>
  <div class="demo">
    <div class="c-selection-overlay is-interactive" data-region="SelectionOverlay" style="position:absolute;inset:0">
      <div class="c-bounds" id="ovl.selection_bounds" style="left:40px;top:30px;width:180px;height:90px">
        <button type="button" class="c-handle nw" id="ovl.resize_handles" aria-label="Resize northwest" style="left:0;top:0"></button>
        <button type="button" class="c-handle ne" aria-label="Resize northeast" style="left:100%;top:0"></button>
        <button type="button" class="c-handle sw" aria-label="Resize southwest" style="left:0;top:100%"></button>
        <button type="button" class="c-handle se" aria-label="Resize southeast" style="left:100%;top:100%"></button>
      </div>
    </div>
  </div>
  <p>Four corner handles only — <strong>no rotation</strong>.</p>
</body>
</html>
