<!DOCTYPE html>
<html lang="en" data-platform="desktop">
<head>
  <meta charset="utf-8" />
  <title>InkScaleToggle — self-contained</title>
  <style>
    :root { --color-primary: #0f766e; --color-chrome: #fff; --color-border: #d0d5dd; --radius-control: 6px; }
    body { margin: 2rem; font-family: system-ui, sans-serif; }
    .c-ink-scale { display: inline-flex; padding: 2px; background: var(--color-chrome); border: 1px solid var(--color-border); border-radius: var(--radius-control); }
    .c-ink-scale button {
      display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border: 0; border-radius: 4px;
      background: transparent; font-size: 12px; cursor: pointer;
    }
    .c-ink-scale button img { width: 14px; height: 14px; }
    .c-ink-scale button:hover { background: rgba(15,118,110,.08); }
    .c-ink-scale button:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--color-primary); }
    .c-ink-scale button:active { background: rgba(15,118,110,.16); }
    .c-ink-scale button[aria-pressed="true"] { background: rgba(15,118,110,.14); color: var(--color-primary); font-weight: 600; }
    .c-ink-scale button:disabled { opacity: .4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="c-ink-scale" id="tgl.ink_scale_mode" role="group" aria-label="Ink scale mode">
    <button type="button" aria-pressed="true">
      <img src="../../system/assets/icon-mode-with-bounds.svg" alt="" /> withBounds
    </button>
    <button type="button" aria-pressed="false">
      <img src="../../system/assets/icon-mode-fixed-ink.svg" alt="" /> fixedInk
    </button>
  </div>
  <script>
    const g = document.getElementById("tgl.ink_scale_mode");
    g.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        g.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", "false"));
        btn.setAttribute("aria-pressed", "true");
      });
    });
  </script>
</body>
</html>
