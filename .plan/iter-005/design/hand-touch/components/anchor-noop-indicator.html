<!DOCTYPE html>
<html lang="en" data-platform="epaper">
<head>
  <meta charset="utf-8" />
  <title>AnchorNoopIndicator — retired (CHL-0024)</title>
  <style>
    body { margin: 1rem; font-family: system-ui, sans-serif; background: #ddd; }
    .c-indicator {
      display: inline-flex; align-items: center; gap: 6px; max-width: 18rem;
      padding: 6px 8px; border: 2px solid #000;
      background: repeating-linear-gradient(-45deg, #fff, #fff 3px, #000 3px, #000 4px);
      font-size: 12px;
    }
    .c-indicator img { width: 20px; height: 20px; background: #fff; border: 1px solid #000; }
    .c-indicator__copy { background: #fff; border: 1px solid #000; padding: 2px 6px; }
    .note { font-size: 12px; max-width: 32rem; }
  </style>
</head>
<body>
  <p class="note">1-bit settled frame — not a blink animation (epaper: no motion). Finger on &lt;64 du = 0 transform.</p>
  <div class="c-indicator" id="ind.finger_anchor_noop">
    <img src="../../system/assets/icon-hand-touch-noop.svg" alt="" />
    <span class="c-indicator__copy">Finger: 0 transform — pen only (56 du)</span>
  </div>
</body>
</html>
