<!DOCTYPE html>
<html lang="en" data-platform="epaper">
<head>
  <meta charset="utf-8" />
  <title>FingerContact — design-preview annotation</title>
  <style>
    :root { --finger-min: 10mm; }
    body { margin: 1rem; font-family: system-ui, sans-serif; background: #ddd; }
    .row { display: flex; gap: 24px; align-items: flex-end; }
    .cell { display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
    .stage { position: relative; width: 120px; height: 120px; background: #fff; border: 1px solid #000; }
    .c-finger {
      position: absolute; left: 50%; top: 50%;
      width: var(--finger-min); height: var(--finger-min);
      margin: calc(var(--finger-min) / -2) 0 0 calc(var(--finger-min) / -2);
      border: 0; border-radius: 50%;
      background: #5a8fd4;
    }
    .c-finger.is-ignored { background: #c5c5c5; }
    .c-finger.is-down {
      width: 6mm; height: 6mm; margin: -3mm 0 0 -3mm;
      background: transparent; border: 2px solid #5a8fd4;
    }
    .c-finger img { display: none; }
    .c-travel {
      position: absolute; left: 20%; top: 50%; height: 0;
      border-top: 2px dashed #5a8fd4;
    }
    .c-travel.is-palm { width: 8mm; }
    .c-travel.is-pan { width: 36mm; }
  </style>
</head>
<body>
  <p>Preview-only. Not product chrome — filled circle, no border, color fill (not 1-bit hatch). Travel ticks are GestureAnnotate, not product chrome.</p>
  <div class="row">
    <div class="cell">one finger
      <div class="stage"><span class="c-finger"></span></div>
    </div>
    <div class="cell">two fingers
      <div class="stage">
        <span class="c-finger" style="left:35%;top:45%"></span>
        <span class="c-finger" style="left:70%;top:60%"></span>
      </div>
    </div>
    <div class="cell">ignored (pan vs move)
      <div class="stage"><span class="c-finger is-ignored"></span></div>
    </div>
    <div class="cell">down + palm travel (≤20 mm)
      <div class="stage">
        <span class="c-finger is-down" style="left:20%;top:50%"></span>
        <span class="c-travel is-palm"></span>
      </div>
    </div>
    <div class="cell">down + pan travel (&gt;20 mm)
      <div class="stage">
        <span class="c-finger is-down" style="left:20%;top:50%"></span>
        <span class="c-travel is-pan"></span>
      </div>
    </div>
  </div>
</body>
</html>
