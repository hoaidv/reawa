<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PenMapButton — component preview</title>
  <style>
    :root {
      --color-surface: #f2f4f7;
      --color-surface-elevated: #ffffff;
      --color-ink: #1c2430;
      --color-ink-muted: #5b6573;
      --color-primary: #0f766e;
      --color-on-primary: #ffffff;
      --color-focus: #0f766e;
      --color-border: #d0d5dd;
      --space-sm: 8px;
      --space-md: 16px;
      --radius-control: 6px;
      --font-body: 14px;
      --target-desktop: 24px;
    }
    body { margin: 0; font-family: "DM Sans", system-ui, sans-serif; background: var(--color-surface); color: var(--color-ink); }
    .c-preview { padding: 1.5rem; }
    .c-preview__title { margin: 0 0 0.5rem; font-size: 1.125rem; }
    .c-preview__note { margin: 0 0 1.5rem; color: var(--color-ink-muted); font-size: 0.875rem; }
    .c-states { display: flex; flex-wrap: wrap; gap: 1rem; }
    .c-states__cell { display: flex; flex-direction: column; gap: 0.35rem; }
    .c-states__label { font-size: 0.75rem; color: var(--color-ink-muted); }
    .c-pen-map-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-sm);
      min-height: var(--target-desktop); min-width: var(--target-desktop);
      padding: var(--space-sm) var(--space-md);
      border: 1px solid var(--color-primary); border-radius: var(--radius-control);
      background: var(--color-surface-elevated); color: var(--color-primary);
      font: inherit; font-size: var(--font-body); font-weight: 600; cursor: pointer;
      transition: background-color .15s ease, color .15s ease, transform .1s ease;
    }
    .c-pen-map-btn:hover { background: var(--color-primary); color: var(--color-on-primary); }
    .c-pen-map-btn:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
    .c-pen-map-btn:active, .c-pen-map-btn.is-pressed { transform: scale(.985); background: var(--color-primary); color: var(--color-on-primary); }
    .c-pen-map-btn[disabled], .c-pen-map-btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
    .c-pen-map-btn[aria-busy="true"] { position: relative; }
    .c-pen-map-btn[aria-busy="true"] .c-pen-map-btn__label { visibility: hidden; }
    .c-pen-map-btn[aria-busy="true"]::after {
      content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid var(--color-primary); border-top-color: transparent;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .c-pen-map-btn { transition: none; }
      .c-pen-map-btn[aria-busy="true"]::after { animation: none; }
    }
  </style>
</head>
<body>
  <main class="c-preview">
    <h1 class="c-preview__title">PenMapButton</h1>
    <p class="c-preview__note">Save / publish control for Infini pen-button map. Desktop ≥24 px. Hover required.</p>
    <h2 class="c-preview__title">States</h2>
    <div class="c-states">
      <div class="c-states__cell">
        <span class="c-states__label">default</span>
        <button type="button" class="c-pen-map-btn" data-interactive><span class="c-pen-map-btn__label">Save and publish</span></button>
      </div>
      <div class="c-states__cell">
        <span class="c-states__label">hover (pointer)</span>
        <button type="button" class="c-pen-map-btn" data-interactive><span class="c-pen-map-btn__label">Save and publish</span></button>
      </div>
      <div class="c-states__cell">
        <span class="c-states__label">focus-visible</span>
        <button type="button" class="c-pen-map-btn" autofocus><span class="c-pen-map-btn__label">Save and publish</span></button>
      </div>
      <div class="c-states__cell">
        <span class="c-states__label">active / pressed</span>
        <button type="button" class="c-pen-map-btn is-pressed"><span class="c-pen-map-btn__label">Save and publish</span></button>
      </div>
      <div class="c-states__cell">
        <span class="c-states__label">disabled</span>
        <button type="button" class="c-pen-map-btn" disabled><span class="c-pen-map-btn__label">Nothing to publish</span></button>
      </div>
      <div class="c-states__cell">
        <span class="c-states__label">loading</span>
        <button type="button" class="c-pen-map-btn" aria-busy="true"><span class="c-pen-map-btn__label">Publishing…</span></button>
      </div>
    </div>
  </main>
  <script>
    (() => {
      for (const el of document.querySelectorAll("[data-interactive]")) {
        el.addEventListener("pointerdown", () => el.classList.add("is-pressed"));
        for (const ev of ["pointerup", "pointerleave", "blur"]) {
          el.addEventListener(ev, () => el.classList.remove("is-pressed"));
        }
      }
    })();
  </script>
</body>
</html>
