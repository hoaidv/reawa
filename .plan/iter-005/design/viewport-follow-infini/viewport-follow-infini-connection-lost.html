<!DOCTYPE html>
<html lang="en" data-platform="desktop">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>follow.connection_lost — viewport-follow-infini</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    .c-follow-toggle:hover, .c-follow-toggle.is-hover { border-color: var(--color-primary); }
    .c-follow-toggle:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
    .c-follow-toggle:active, .c-follow-toggle.is-pressed { transform: scale(0.96); }
    .c-follow-toggle[disabled], .c-follow-toggle[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; }
    .c-canvas-stage:hover { cursor: grab; }
    .c-canvas-stage:active, .c-canvas-stage.is-pressed { cursor: grabbing; }
    .c-canvas-stage:focus-visible { box-shadow: inset 0 0 0 3px var(--color-focus); }
  </style>
</head>
<body data-state="follow.connection_lost">
  <div data-region="WindowFrame">
    <div class="app-mark" aria-hidden="true">Infini</div>
    <button type="button" class="c-canvas-stage" data-region="CanvasStage" data-interactive aria-label="Infinity canvas">
      <div class="c-world-layer" data-region="WorldLayer" style="transform: translate(0px, 0px) scale(1)">
        <div class="figure figure-circle" title="circle"></div>
        <div class="figure figure-rect" title="rect"></div>
        <div class="figure figure-line" title="line"></div>
      </div>
    </button>
    <div class="c-chrome-trailing">
      <div class="c-follow-cluster" data-region="FollowToggle">
        <button type="button" class="c-follow-toggle" disabled aria-pressed="false" aria-label="Follow Epaper unavailable">
          <img src="../system/assets/icon-viewport-follow-infini-offline.svg" alt="" />
        </button>
        <p class="c-follow-caption" data-tone="muted">No session — follow off</p>
      </div>
      <div class="c-zoom-readout" data-region="StatusZoom" aria-live="polite">100%</div>
    </div>
    <p class="scene-legend">
      <strong>follow.connection_lost</strong>
      Connection lost. Follow is off and will not restore.
    </p>
  </div>
  <script>
    document.querySelectorAll("[data-interactive]").forEach(function (el) {
      el.addEventListener("pointerdown", function () { el.classList.add("is-pressed"); });
      ["pointerup", "pointerleave", "blur"].forEach(function (ev) {
        el.addEventListener(ev, function () { el.classList.remove("is-pressed"); });
      });
    });
  </script>
</body>
</html>
