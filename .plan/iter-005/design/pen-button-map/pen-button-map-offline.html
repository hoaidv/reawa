<!DOCTYPE html>
<html lang="en" data-platform="epaper">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>map.offline — settings</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    .c-pen-map-close:active, .c-pen-map-close.is-pressed,
    .c-settings-item:active, .c-settings-item.is-pressed,
    .c-pen-map-option:active, .c-pen-map-option.is-pressed { background: #000; color: #fff; }
    .c-pen-map-close:active img, .c-pen-map-close.is-pressed img,
    .c-settings-item:active img, .c-settings-item.is-pressed img,
    .c-pen-map-option:active img, .c-pen-map-option.is-pressed img { filter: invert(1); }
  </style>
</head>
<body data-state="map.offline">
  <div data-region="DeviceScreen" data-platform="epaper" data-orientation="gutToLeft">
    <div class="c-settings" data-region="SettingsPage">
      <div class="c-settings-head">
        <h1>Settings</h1>
        <a class="c-pen-map-close" data-interactive href="./pen-button-map-entry.html" aria-label="Close">
          <img src="../system/assets/icon-epaper-pen-map-close.svg" alt="" />
        </a>
      </div>
      <div class="c-settings-body">
        <nav class="c-settings-master" data-region="SettingsMaster" aria-label="Settings">
          <button type="button" class="c-settings-item" data-interactive aria-current="page">
            <img src="../system/assets/icon-epaper-pen-map.svg" alt="" />
            Pen buttons
          </button>
        </nav>
        <section class="c-settings-detail" data-region="PenMapOverlay">
          <p class="c-pen-map-cap">Tablet reports 1 barrel button.</p>
          <p class="c-pen-map-note">Eraser nib is hardware, not a barrel slot.</p>
          <p class="c-pen-map-offline"><img src="../system/assets/icon-epaper-pen-map-offline.svg" alt="" /> Desktop session down. Live map still applies. Persist waits.</p>
          <div class="c-pen-map-body">
            <div class="c-pen-map-row" data-region="SlotRow">
              <h2><img src="../system/assets/icon-epaper-pen-map-button-1.svg" alt="" /> Button 1</h2>
              <div class="c-pen-map-list" data-region="ClickList">
                <h3>Click</h3>
                <button type="button" class="c-pen-map-option" data-interactive data-group="b1-click" aria-selected="true">
                  <img src="../system/assets/icon-epaper-pen-map-freeform.svg" alt="" />
                  Current primary ↔ Freeform Select
                </button>
                <button type="button" class="c-pen-map-option" data-interactive data-group="b1-click" aria-selected="false">
                  <img src="../system/assets/icon-epaper-pen-map-eraser.svg" alt="" />
                  Current primary ↔ Eraser
                </button>
                <button type="button" class="c-pen-map-option" data-interactive data-group="b1-click" aria-selected="false">
                  <img src="../system/assets/icon-epaper-pen-map-off.svg" alt="" />
                  Off
                </button>
              </div>
              <div class="c-pen-map-list" data-region="HoldList">
                <h3>Hold-move</h3>
                <button type="button" class="c-pen-map-option" data-interactive data-group="b1-hold" aria-selected="true">
                  <img src="../system/assets/icon-epaper-pen-map-eraser.svg" alt="" />
                  Temporary eraser
                </button>
                <button type="button" class="c-pen-map-option" data-interactive data-group="b1-hold" aria-selected="false">
                  <img src="../system/assets/icon-epaper-pen-map-drag.svg" alt="" />
                  Drag node under tip
                </button>
                <button type="button" class="c-pen-map-option" data-interactive data-group="b1-hold" aria-selected="false">
                  <img src="../system/assets/icon-epaper-pen-map-off.svg" alt="" />
                  Off
                </button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
  <script>
    document.querySelectorAll("[data-interactive]").forEach((el) => {
      el.addEventListener("pointerdown", () => el.classList.add("is-pressed"));
      ["pointerup", "pointerleave", "blur"].forEach((ev) => el.addEventListener(ev, () => el.classList.remove("is-pressed")));
    });
    document.querySelectorAll(".c-pen-map-option[data-group]").forEach((el) => {
      el.addEventListener("click", () => {
        const g = el.getAttribute("data-group");
        document.querySelectorAll('.c-pen-map-option[data-group="' + g + '"]').forEach((n) => n.setAttribute("aria-selected", n === el ? "true" : "false"));
      });
    });
  </script>
</body>
</html>
