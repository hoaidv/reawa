<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PenMapButtonRow — component preview</title>
  <style>
    :root {
      --color-surface: #f2f4f7;
      --color-surface-elevated: #ffffff;
      --color-ink: #1c2430;
      --color-ink-muted: #5b6573;
      --color-primary: #0f766e;
      --color-focus: #0f766e;
      --color-border: #d0d5dd;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --radius-control: 6px;
      --font-body: 14px;
      --font-title: 16px;
      --font-caption: 12px;
      --target-desktop: 24px;
    }
    body { margin: 0; font-family: "DM Sans", system-ui, sans-serif; background: var(--color-surface); color: var(--color-ink); }
    .c-preview { padding: 1.5rem; max-width: 40rem; }
    .c-pen-map-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md);
      padding: var(--space-md) 0 0; border-top: 1px solid var(--color-border);
    }
    .c-pen-map-row__heading {
      grid-column: 1 / -1; display: flex; align-items: center; gap: var(--space-sm);
      margin: 0 0 var(--space-xs); font-size: var(--font-title); font-weight: 600;
    }
    .c-pen-map-row__heading img { width: 24px; height: 24px; }
    .c-pen-map-slot { display: flex; flex-direction: column; gap: var(--space-xs); }
    .c-pen-map-slot__label { display: flex; align-items: center; gap: var(--space-xs); font-size: var(--font-caption); font-weight: 600; color: var(--color-ink-muted); }
    .c-pen-map-slot__label img { width: 16px; height: 16px; }
    .c-pen-map-select {
      display: flex; align-items: center; gap: var(--space-sm); width: 100%;
      min-height: var(--target-desktop); padding: var(--space-sm) var(--space-md);
      border: 1px solid var(--color-border); border-radius: var(--radius-control);
      background: var(--color-surface-elevated); color: var(--color-ink);
      font: inherit; font-size: var(--font-body); text-align: left; cursor: pointer;
      transition: background-color .15s ease, border-color .15s ease, transform .1s ease;
    }
    .c-pen-map-select:hover { border-color: var(--color-primary); background: var(--color-surface); }
    .c-pen-map-select:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
    .c-pen-map-select:active { transform: scale(.985); }
    .c-pen-map-select img { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <main class="c-preview">
    <article class="c-pen-map-row" data-region="ButtonRow" data-button-index="1">
      <h2 class="c-pen-map-row__heading">
        <img src="../../system/assets/icon-pen-map-button-1.svg" alt="" />
        Button 1
      </h2>
      <div class="c-pen-map-slot" data-region="SlotClick">
        <span class="c-pen-map-slot__label"><img src="../../system/assets/icon-pen-map-click.svg" alt="" /> Click</span>
        <button type="button" class="c-pen-map-select">
          <img src="../../system/assets/icon-pen-map-pen.svg" alt="" />
          Pen ↔ freeform
        </button>
      </div>
      <div class="c-pen-map-slot" data-region="SlotHoldMove">
        <span class="c-pen-map-slot__label"><img src="../../system/assets/icon-pen-map-hold.svg" alt="" /> Hold-move</span>
        <button type="button" class="c-pen-map-select">
          <img src="../../system/assets/icon-pen-map-freeform.svg" alt="" />
          Temporary freeform
        </button>
      </div>
    </article>
  </main>
</body>
</html>
