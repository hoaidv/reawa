<!DOCTYPE html>
<html lang="en" data-platform="epaper">
<head>
  <meta charset="utf-8" />
  <title>PenMapOverlay — UI-EP-08</title>
  <style>
    :root {
      --target-epaper: 10mm; --pen-map-icon: 4mm; --chip-inset: 2mm;
      --color-ink: #000; --color-paper: #fff;
      --font-caption: 11px; --font-label: 12px;
    }
    body { margin: 1rem; font-family: system-ui, sans-serif; background: #ddd; cursor: none; }
    .c-settings-detail {
      width: 170mm; min-height: 60mm; background: #fff; border: 1px solid #000; padding: 2mm;
    }
    .c-pen-map-cap, .c-pen-map-note, .c-pen-map-empty { margin: 4px 0 0; font-size: var(--font-caption); }
    .c-pen-map-empty { font-size: var(--font-label); }
    .note { font-size: 12px; max-width: 40rem; }
  </style>
</head>
<body>
  <p class="note">Detail pane of Settings (CHL-0025). 0-button: 0 slot rows. No Save footer. Full shell: settings-shell.html.</p>
  <div class="c-settings-detail" data-region="PenMapOverlay">
    <p class="c-pen-map-cap">Tablet reports 0 barrel buttons. Slots are hidden.</p>
    <p class="c-pen-map-empty">0 barrel slots. ToolChip remains complete.</p>
    <p class="c-pen-map-note">Eraser nib is hardware, not a barrel slot.</p>
  </div>
</body>
</html>
