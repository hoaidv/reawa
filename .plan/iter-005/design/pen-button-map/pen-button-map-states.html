<!DOCTYPE html>
<html lang="en" data-platform="desktop">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pen-button map — control states</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    body { padding: var(--space-lg); background: var(--color-surface); }
    .showcase-title { font-family: var(--font-display-face); font-size: var(--font-display); margin: 0 0 var(--space-sm); }
    .showcase-note { margin: 0 0 var(--space-lg); color: var(--color-ink-muted); font-size: var(--font-caption); max-width: 40rem; }
    h2 { font-size: var(--font-title); margin: var(--space-lg) 0 var(--space-sm); }
    .row { display: flex; flex-wrap: wrap; gap: var(--space-md); }
    .swatch {
      width: 240px; min-height: 120px; padding: var(--space-sm);
      border: 1px solid var(--color-border); border-radius: var(--radius-control);
      background: var(--color-surface-elevated);
    }
    .swatch label { display: block; font-size: var(--font-caption); color: var(--color-ink-muted); margin-bottom: var(--space-sm); }
    .c-pen-map-btn:hover { background: var(--color-primary); color: var(--color-on-primary); }
    .c-pen-map-select:hover { border-color: var(--color-primary); background: var(--color-surface); }
    .c-pen-map-option:hover { background: var(--color-surface); }
    .c-pen-map-btn:focus-visible,
    .c-pen-map-select:focus-visible,
    .c-pen-map-option:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
    .c-pen-map-btn:active,
    .c-pen-map-select:active,
    .c-pen-map-option:active { transform: scale(0.985); }
  </style>
</head>
<body>
  <h1 class="showcase-title">Control states — Pen-button map</h1>
  <p class="showcase-note">Platform: desktop Electron. Hover required. Targets ≥24 px. N/A: touch-only hover skip. Empty collection N/A (this is a settings form, not a list fetch).</p>

  <h2>btn.save (PenMapButton)</h2>
  <div class="row">
    <div class="swatch">
      <label>default</label>
      <button type="button" class="c-pen-map-btn" data-interactive><span class="c-pen-map-btn__label">Save and publish</span></button>
    </div>
    <div class="swatch">
      <label>hover (pointer)</label>
      <button type="button" class="c-pen-map-btn" data-interactive><span class="c-pen-map-btn__label">Save and publish</span></button>
    </div>
    <div class="swatch">
      <label>focus-visible</label>
      <button type="button" class="c-pen-map-btn"><span class="c-pen-map-btn__label">Save and publish</span></button>
    </div>
    <div class="swatch">
      <label>active / pressed</label>
      <button type="button" class="c-pen-map-btn is-pressed"><span class="c-pen-map-btn__label">Save and publish</span></button>
    </div>
    <div class="swatch">
      <label>disabled</label>
      <button type="button" class="c-pen-map-btn" disabled><span class="c-pen-map-btn__label">Nothing to publish</span></button>
    </div>
    <div class="swatch">
      <label>loading</label>
      <button type="button" class="c-pen-map-btn" aria-busy="true"><span class="c-pen-map-btn__label">Publishing…</span></button>
    </div>
  </div>

  <h2>list.slot_click / list.slot_hold (PenMapSelect)</h2>
  <div class="row">
    <div class="swatch">
      <label>default closed</label>
      <button type="button" class="c-pen-map-select" data-interactive>Pen ↔ freeform</button>
    </div>
    <div class="swatch">
      <label>hover (pointer)</label>
      <button type="button" class="c-pen-map-select" data-interactive>Temporary freeform</button>
    </div>
    <div class="swatch">
      <label>focus-visible</label>
      <button type="button" class="c-pen-map-select">Pen ↔ eraser</button>
    </div>
    <div class="swatch">
      <label>active / pressed</label>
      <button type="button" class="c-pen-map-select is-pressed">Undo</button>
    </div>
    <div class="swatch">
      <label>disabled</label>
      <button type="button" class="c-pen-map-select" disabled>Off</button>
    </div>
    <div class="swatch">
      <label>invalid</label>
      <button type="button" class="c-pen-map-select" aria-invalid="true">legacy_bind</button>
    </div>
    <div class="swatch">
      <label>open / selected option</label>
      <button type="button" class="c-pen-map-option is-selected" aria-selected="true">Pen ↔ freeform</button>
    </div>
  </div>

  <h2>Catalogue option (PenMapOption)</h2>
  <div class="row">
    <div class="swatch">
      <label>default</label>
      <button type="button" class="c-pen-map-option" data-interactive>Off</button>
    </div>
    <div class="swatch">
      <label>hover</label>
      <button type="button" class="c-pen-map-option" data-interactive>Temporary rectangle</button>
    </div>
    <div class="swatch">
      <label>focus-visible</label>
      <button type="button" class="c-pen-map-option">Drag node under tip</button>
    </div>
    <div class="swatch">
      <label>active</label>
      <button type="button" class="c-pen-map-option is-pressed">Temporary erase</button>
    </div>
    <div class="swatch">
      <label>selected</label>
      <button type="button" class="c-pen-map-option" aria-selected="true">Temporary freeform</button>
    </div>
  </div>

  <script>
    (() => {
      for (const el of document.querySelectorAll("[data-interactive]")) {
        el.addEventListener("pointerdown", () => el.classList.add("is-pressed"));
        for (const ev of ["pointerup", "pointerleave", "blur"]) {
          el.addEventListener(ev, () => el.classList.remove("is-pressed"));
        }
      }
    })();
  </script>
</body>
</html>
