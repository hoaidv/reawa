<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>infinity-canvas — scene navigator</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    body { margin: 0; font-family: var(--font-sans); background: #e8eaee; }
    .nav-shell { display: flex; min-height: 100vh; }
    .nav-side {
      width: 16rem; flex-shrink: 0; padding: 1rem;
      border-right: 1px solid var(--color-border); background: var(--color-surface-elevated);
    }
    .nav-side strong { display: block; margin-bottom: 0.75rem; font-family: var(--font-display-face); }
    .nav-side a {
      display: block; padding: 0.45rem 0.5rem; margin: 0.15rem 0;
      border-radius: var(--radius-control); color: inherit; text-decoration: none;
      font-size: var(--font-body);
    }
    .nav-side a:hover, .nav-side a:focus-visible { background: var(--color-surface); outline: none; }
    .nav-side a[aria-current="page"] { background: var(--color-surface); font-weight: 600; }
    .nav-main {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; padding: 1rem; min-width: 0;
    }
    .nav-main .hint { align-self: stretch; margin: 0 0 0.75rem; font-size: 0.875rem; color: var(--color-ink-muted); }
    .preview-stage { display: flex; justify-content: center; width: 100%; }
    .preview-scale { transform-origin: top center; background: #fff; box-shadow: 0 1px 8px rgb(0 0 0 / 12%); }
    .preview-scale iframe { display: block; border: 0; width: 100%; height: 100%; background: #fff; }
    .preview-stage[data-preview-scale="desktop"] .preview-scale {
      width: min(1280px, 100%); height: calc(100vh - 4rem);
      transform: scale(1);
      border: 1px solid var(--color-border);
    }
  </style>
</head>
<body>
  <div class="nav-shell" data-platform="desktop">
    <nav class="nav-side" aria-label="Scenes">
      <strong>infinity-canvas</strong>
      <a href="./infinity-canvas-empty.html" target="scene-preview">canvas.empty</a>
      <a href="./infinity-canvas-populated.html" target="scene-preview" aria-current="page">canvas.populated</a>
      <a href="./infinity-canvas-gesturing.html" target="scene-preview">canvas.gesturing</a>
      <a href="./infinity-canvas-resized.html" target="scene-preview">canvas.resized</a>
      <a href="./infinity-canvas-states.html" target="scene-preview">States showcase</a>
    </nav>
    <main class="nav-main">
      <p class="hint">Desktop preview @ 100%. Keep this navigator open — scenes load in the frame.</p>
      <div class="preview-stage" data-preview-scale="desktop">
        <div class="preview-scale">
          <iframe
            name="scene-preview"
            title="Scene preview"
            src="./infinity-canvas-populated.html"
          ></iframe>
        </div>
      </div>
    </main>
  </div>
  <script>
    document.querySelectorAll('.nav-side a[target="scene-preview"]').forEach(function (a) {
      a.addEventListener('click', function () {
        document.querySelectorAll('.nav-side a[aria-current]').forEach(function (el) {
          el.removeAttribute('aria-current');
        });
        a.setAttribute('aria-current', 'page');
      });
    });
  </script>
</body>
</html>
