<!DOCTYPE html>
<html lang="en" data-platform="desktop">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Infini — canvas.gesturing</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    /* live states required in-scene for gate (also in common.css) */
    .c-canvas-stage:hover { cursor: grab; }
    .c-canvas-stage:active, .c-canvas-stage.is-gesturing { cursor: grabbing; }
    .c-canvas-stage:focus-visible { box-shadow: inset 0 0 0 3px var(--color-focus); }
  </style>
</head>
<body data-state="canvas.gesturing">
  <div data-region="WindowFrame">
    <div class="app-mark" aria-hidden="true">Infini</div>
    <div class="c-zoom-readout" data-region="StatusZoom" aria-live="polite">142%</div>
    <button type="button" class="c-canvas-stage is-gesturing" data-region="CanvasStage" aria-label="Infinity canvas" aria-pressed="true">
      <div class="c-world-layer" data-region="WorldLayer" style="transform: translate(72px, -36px) scale(1.42)">
        <div class="figure figure-circle"></div>
        <div class="figure figure-rect"></div>
        <div class="figure figure-line"></div>
      </div>
    </button>
    <p class="gesture-legend">
      <strong>Gesturing</strong>
      Cursor grabbing · zoom readout live · no modal chrome
    </p>
  </div>
</body>
</html>
