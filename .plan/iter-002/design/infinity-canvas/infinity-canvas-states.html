<!DOCTYPE html>
<html lang="en" data-platform="desktop">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Infini — states showcase</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    body { padding: var(--space-lg); background: var(--color-surface); }
    h1 { font-family: var(--font-display-face); font-size: var(--font-display); margin: 0 0 var(--space-md); }
    h2 { font-size: var(--font-title); margin: var(--space-lg) 0 var(--space-sm); }
    .row { display: flex; flex-wrap: wrap; gap: var(--space-md); }
    .swatch {
      width: 220px; min-height: 140px; padding: var(--space-sm);
      border: 1px solid var(--color-border); border-radius: var(--radius-control);
      background: var(--color-surface-elevated);
    }
    .swatch label { display: block; font-size: var(--font-caption); color: var(--color-ink-muted); margin-bottom: var(--space-sm); }
    .mini-stage {
      width: 100%; height: 96px; border: 0; cursor: grab; background: var(--color-surface);
      outline: none;
    }
    .mini-stage:hover { cursor: grab; }
    .mini-stage:active, .mini-stage.is-gesturing { cursor: grabbing; }
    .mini-stage:focus-visible { box-shadow: inset 0 0 0 3px var(--color-focus); }
    .mini-stage:disabled { opacity: 0.45; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>Control states — Infinity canvas</h1>

  <h2>ctrl.canvas (CanvasStage)</h2>
  <div class="row">
    <div class="swatch">
      <label>default</label>
      <button type="button" class="mini-stage c-canvas-stage" aria-label="Canvas default">default</button>
    </div>
    <div class="swatch">
      <label>hover (use pointer)</label>
      <button type="button" class="mini-stage c-canvas-stage" aria-label="Canvas hover">hover → grab</button>
    </div>
    <div class="swatch">
      <label>focus-visible</label>
      <button type="button" class="mini-stage c-canvas-stage" autofocus aria-label="Canvas focus">Tab focus</button>
    </div>
    <div class="swatch">
      <label>active / gesturing</label>
      <button type="button" class="mini-stage c-canvas-stage is-gesturing" aria-label="Canvas gesturing" aria-pressed="true">grabbing</button>
    </div>
  </div>

  <h2>ctrl.zoom_readout (display)</h2>
  <div class="row">
    <div class="swatch">
      <label>100%</label>
      <div class="c-zoom-readout" style="position:static">100%</div>
    </div>
    <div class="swatch">
      <label>live during gesture</label>
      <div class="c-zoom-readout" style="position:static">142%</div>
    </div>
  </div>
</body>
</html>
