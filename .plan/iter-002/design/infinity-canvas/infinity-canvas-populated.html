<!DOCTYPE html>
<html lang="en" data-platform="desktop">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Infini — canvas.populated</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    /* live states required in-scene for gate (also in common.css) */
    .c-canvas-stage:hover { cursor: grab; }
    .c-canvas-stage:active, .c-canvas-stage.is-gesturing { cursor: grabbing; }
    .c-canvas-stage:focus-visible { box-shadow: inset 0 0 0 3px var(--color-focus); }
  </style>
</head>
<body data-state="canvas.populated">
  <div data-region="WindowFrame">
    <div class="app-mark" aria-hidden="true">Infini</div>
    <div class="c-zoom-readout" data-region="StatusZoom" aria-live="polite">100%</div>
    <button type="button" class="c-canvas-stage" data-region="CanvasStage" aria-label="Infinity canvas">
      <div class="c-world-layer" data-region="WorldLayer" style="transform: translate(0px, 0px) scale(1)">
        <div class="figure figure-circle" title="circle — stays circular under uniform scale"></div>
        <div class="figure figure-rect" title="rect"></div>
        <div class="figure figure-line" title="line"></div>
      </div>
    </button>
    <p class="gesture-legend">
      <strong>Gestures</strong>
      Trackpad pan · Mouse drag pan · Wheel pan · ⌘/Ctrl+wheel zoom · Pinch zoom
      <br />Transform = translate + uniform scale
    </p>
  </div>
</body>
</html>
