<!DOCTYPE html>
<html lang="en" data-platform="epaper">
<head>
  <meta charset="utf-8" />
  <title>ConnStyle — Ink / Curve</title>
  <style>
    body { margin: 1rem; font-family: system-ui, sans-serif; background: #ddd; }
    .c-style-chip { display: inline-flex; border: 1px solid #000; overflow: hidden; background: #fff; }
    .c-tool-btn {
      width: 48px; height: 48px; border: 0; border-right: 1px solid #000; background: #fff;
      display: flex; align-items: center; justify-content: center; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .c-tool-btn:last-child { border-right: 0; }
    .c-tool-btn img { width: 20px; height: 20px; pointer-events: none; }
    .c-tool-btn[aria-pressed="true"], .c-tool-btn:active, .c-tool-btn.is-pressed { background: #000; }
    .c-tool-btn[aria-pressed="true"] img, .c-tool-btn:active img, .c-tool-btn.is-pressed img { filter: invert(1); }
  </style>
</head>
<body>
  <p>Selected connector — Ink \| Curve. No hover. Press inverts.</p>
  <div class="c-style-chip" data-region="ConnSelect">
    <button type="button" class="c-tool-btn" data-interactive id="tgl.conn_style.ink" aria-pressed="true" aria-label="Ink"><img src="../../system/assets/icon-epaper-style-ink.svg" alt="" /></button>
    <button type="button" class="c-tool-btn" data-interactive id="tgl.conn_style.curve" aria-pressed="false" aria-label="Curve"><img src="../../system/assets/icon-epaper-style-curve.svg" alt="" /></button>
  </div>
  <script>
    document.querySelectorAll("[data-interactive]").forEach((el) => {
      el.addEventListener("pointerdown", () => el.classList.add("is-pressed"));
      ["pointerup","pointerleave","blur"].forEach((ev) => el.addEventListener(ev, () => el.classList.remove("is-pressed")));
    });
    document.querySelectorAll(".c-style-chip .c-tool-btn").forEach((el) => {
      el.addEventListener("click", () => {
        document.querySelectorAll(".c-style-chip .c-tool-btn").forEach((b) => b.setAttribute("aria-pressed", "false"));
        el.setAttribute("aria-pressed", "true");
      });
    });
  </script>
</body>
</html>
