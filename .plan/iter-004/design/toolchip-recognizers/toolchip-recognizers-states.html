<!DOCTYPE html>
<html lang="en" data-platform="epaper">
<head>
  <meta charset="utf-8" />
  <title>ToolChip — states showcase</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    html, body { overflow: auto; height: auto; background: #fff; }
    .show { padding: 16px; display: grid; gap: 24px; }
    .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
    .cell { display: flex; flex-direction: column; gap: 6px; }
    .lab { font-size: 11px; }
    .note { font-size: 12px; max-width: 40rem; }
    .c-tool-chip { position: static; transform: none; }
  </style>
</head>
<body>
  <div class="show">
    <p class="note">Platform <strong>epaper</strong>: hover N/A · focus N/A · press = invert · no motion. Dimmed ≠ disarmed.</p>
    <section>
      <strong>Exclusive tool tile</strong>
      <div class="row">
        <div class="cell"><span class="lab">default</span>
          <div class="c-tool-cluster"><button type="button" class="c-tool-btn" data-interactive aria-pressed="false" aria-label="Pen"><img src="../system/assets/icon-epaper-pen.svg" alt="" /></button></div>
        </div>
        <div class="cell"><span class="lab">armed</span>
          <div class="c-tool-cluster"><button type="button" class="c-tool-btn" aria-pressed="true" aria-label="Pen"><img src="../system/assets/icon-epaper-pen.svg" alt="" /></button></div>
        </div>
        <div class="cell"><span class="lab">pressed (:active)</span>
          <div class="c-tool-cluster"><button type="button" class="c-tool-btn is-pressed" data-interactive aria-pressed="false" aria-label="Pen"><img src="../system/assets/icon-epaper-pen.svg" alt="" /></button></div>
        </div>
        <div class="cell"><span class="lab">hover — N/A</span>
          <div class="c-tool-cluster"><button type="button" class="c-tool-btn" aria-pressed="false" aria-label="Pen"><img src="../system/assets/icon-epaper-pen.svg" alt="" /></button></div>
        </div>
        <div class="cell"><span class="lab">focus — N/A</span>
          <div class="c-tool-cluster"><button type="button" class="c-tool-btn" aria-pressed="false" aria-label="Pen"><img src="../system/assets/icon-epaper-pen.svg" alt="" /></button></div>
        </div>
      </div>
    </section>
    <section>
      <strong>Recognizer toggle</strong>
      <div class="row">
        <div class="cell"><span class="lab">disarmed</span>
          <div class="c-tool-cluster"><button type="button" class="c-tool-btn" data-interactive aria-pressed="false" aria-label="Connector recognition"><img src="../system/assets/icon-epaper-recog-connector.svg" alt="" /></button></div>
        </div>
        <div class="cell"><span class="lab">armed</span>
          <div class="c-tool-cluster"><button type="button" class="c-tool-btn" aria-pressed="true" aria-label="Connector recognition"><img src="../system/assets/icon-epaper-recog-connector.svg" alt="" /></button></div>
        </div>
        <div class="cell"><span class="lab">dimmed + armed</span>
          <div class="c-tool-cluster"><button type="button" class="c-tool-btn is-dimmed" aria-pressed="true" aria-disabled="true" aria-label="Connector recognition"><img src="../system/assets/icon-epaper-recog-connector.svg" alt="" /></button></div>
        </div>
        <div class="cell"><span class="lab">dimmed + disarmed</span>
          <div class="c-tool-cluster"><button type="button" class="c-tool-btn is-dimmed" aria-pressed="false" aria-disabled="true" aria-label="Connector recognition"><img src="../system/assets/icon-epaper-recog-connector.svg" alt="" /></button></div>
        </div>
      </div>
    </section>
    <section>
      <strong>Undo (never armed)</strong>
      <div class="row">
        <div class="cell"><span class="lab">default / empty (tappable)</span>
          <div class="c-tool-cluster"><button type="button" class="c-tool-btn" data-interactive aria-pressed="false" aria-label="Undo"><img src="../system/assets/icon-epaper-undo.svg" alt="" /></button></div>
        </div>
        <div class="cell"><span class="lab">pressed</span>
          <div class="c-tool-cluster"><button type="button" class="c-tool-btn is-pressed" data-interactive aria-pressed="false" aria-label="Undo"><img src="../system/assets/icon-epaper-undo.svg" alt="" /></button></div>
        </div>
      </div>
    </section>
  </div>
  <script>
    document.querySelectorAll("[data-interactive]").forEach((el) => {
      el.addEventListener("pointerdown", () => el.classList.add("is-pressed"));
      ["pointerup", "pointerleave", "blur"].forEach((ev) => el.addEventListener(ev, () => el.classList.remove("is-pressed")));
    });
  </script>
</body>
</html>
