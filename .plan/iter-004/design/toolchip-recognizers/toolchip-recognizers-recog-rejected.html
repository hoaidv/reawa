<!DOCTYPE html>
<html lang="en" data-platform="epaper">
<head>
  <meta charset="utf-8" />
  <title>ToolChip — recog.rejected</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    /* live press — epaper has no hover; gate scans this file for :active */
    .c-tool-btn:active, .c-tool-btn.is-pressed { background: #000; color: #fff; }
    .c-tool-btn:active img, .c-tool-btn.is-pressed img { filter: invert(1); }
  </style>
  <style>a.c-tool-btn { text-decoration: none; color: inherit; }</style>
</head>
<body data-state="recog.rejected">
  <div data-region="DeviceScreen" data-orientation="gutToLeft">
    <div data-region="InkSurface">
      <svg class="ink-demo" viewBox="0 0 400 300" aria-hidden="true">
        <rect x="80" y="70" width="40" height="36" fill="none" stroke="#000" stroke-width="3"/>
        <path class="ink-stroke" d="M60 160c50 10 90-20 140 0"/>
      </svg>
      <p class="scene-caption">Guards failed — stroke stayed ink · no banner · toggles still armed</p>
    </div>
    <div class="c-tool-chip" data-region="ToolChip" role="toolbar" aria-label="Tools">
      <div class="c-tool-cluster">
        <span class="c-publish" data-status="linked"></span>
        <button type="button" class="c-tool-btn" data-interactive aria-pressed="false" aria-label="Selection rect"><img src="../system/assets/icon-epaper-sel-rect.svg" alt="" /></button>
        <button type="button" class="c-tool-btn" data-interactive aria-pressed="false" aria-label="Selection freeform"><img src="../system/assets/icon-epaper-sel-freeform.svg" alt="" /></button>
        <a class="c-tool-btn" data-interactive href="./toolchip-recognizers-pen-armed.html" aria-pressed="true" aria-label="Pen"><img src="../system/assets/icon-epaper-pen.svg" alt="" /></a>
      </div>
      <div class="c-tool-cluster">
        <button type="button" class="c-tool-btn" data-interactive aria-pressed="true" aria-label="Ink-box recognition"><img src="../system/assets/icon-epaper-recog-ink-box.svg" alt="" /></button>
        <button type="button" class="c-tool-btn" data-interactive aria-pressed="true" aria-label="Connector recognition"><img src="../system/assets/icon-epaper-recog-connector.svg" alt="" /></button>
      </div>
      <div class="c-tool-cluster">
        <button type="button" class="c-tool-btn" data-interactive aria-pressed="false" aria-label="Undo"><img src="../system/assets/icon-epaper-undo.svg" alt="" /></button>
        <button type="button" class="c-tool-btn" data-interactive aria-pressed="false" aria-label="Redo"><img src="../system/assets/icon-epaper-redo.svg" alt="" /></button>
      </div>
    </div>
    <p data-region="StatusLine">recog.rejected · 0 extra chrome</p>
  </div>
  <script>
    document.querySelectorAll("[data-interactive]").forEach((el) => {
      el.addEventListener("pointerdown", () => el.classList.add("is-pressed"));
      ["pointerup", "pointerleave", "blur"].forEach((ev) => el.addEventListener(ev, () => el.classList.remove("is-pressed")));
    });
  </script>
</body>
</html>
