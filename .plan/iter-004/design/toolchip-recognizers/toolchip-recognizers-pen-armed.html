<!DOCTYPE html>
<html lang="en" data-platform="epaper">
<head>
  <meta charset="utf-8" />
  <title>ToolChip — tool.pen both armed</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    /* live press — epaper has no hover; gate scans this file for :active */
    .c-tool-btn:active, .c-tool-btn.is-pressed { background: #000; color: #fff; }
    .c-tool-btn:active img, .c-tool-btn.is-pressed img { filter: invert(1); }
  </style>
  <style>
    a.c-tool-btn { text-decoration: none; color: inherit; }
  </style>
</head>
<body data-state="tool.pen">
  <div data-region="DeviceScreen" data-orientation="gutToLeft">
    <div data-region="InkSurface">
      <svg class="ink-demo" viewBox="0 0 400 300" aria-hidden="true">
        <path class="ink-stroke" d="M40 80c40-30 90-20 120 20s80 40 140 10"/>
        <path class="ink-stroke" d="M60 160c50 10 90-20 140 0"/>
      </svg>
      <p class="scene-caption">Pen armed · both recognizers on · 3 clusters · 64 px tiles</p>
      <span class="orient-tag">orient: gutToLeft</span>
    </div>
    <div class="c-tool-chip" data-region="ToolChip" role="toolbar" aria-label="Tools">
      <div class="c-tool-cluster">
        <span class="c-publish" id="ind.publish_status" data-status="linked" title="Linked"></span>
        <a class="c-tool-btn" data-interactive href="./toolchip-recognizers-sel-rect-dimmed.html" aria-pressed="false" aria-label="Selection rect"><img src="../system/assets/icon-epaper-sel-rect.svg" alt="" /></a>
        <button type="button" class="c-tool-btn" data-interactive id="tool.sel_freeform" aria-pressed="false" aria-label="Selection freeform"><img src="../system/assets/icon-epaper-sel-freeform.svg" alt="" /></button>
        <button type="button" class="c-tool-btn" data-interactive id="tool.pen" aria-pressed="true" aria-label="Pen"><img src="../system/assets/icon-epaper-pen.svg" alt="" /></button>
      </div>
      <div class="c-tool-cluster">
        <button type="button" class="c-tool-btn" data-interactive id="tgl.recog.ink_box" aria-pressed="true" aria-label="Ink-box recognition"><img src="../system/assets/icon-epaper-recog-ink-box.svg" alt="" /></button>
        <a class="c-tool-btn" data-interactive href="./toolchip-recognizers-connector-off.html" aria-pressed="true" aria-label="Connector recognition"><img src="../system/assets/icon-epaper-recog-connector.svg" alt="" /></a>
      </div>
      <div class="c-tool-cluster">
        <a class="c-tool-btn" data-interactive href="./toolchip-recognizers-undo-empty.html" aria-pressed="false" aria-label="Undo"><img src="../system/assets/icon-epaper-undo.svg" alt="" /></a>
        <button type="button" class="c-tool-btn" data-interactive id="cta.redo" aria-pressed="false" aria-label="Redo"><img src="../system/assets/icon-epaper-redo.svg" alt="" /></button>
      </div>
    </div>
    <p data-region="StatusLine">tool: pen · recog.ink_box on · recog.connector on</p>
  </div>
  <script>
    document.querySelectorAll("[data-interactive]").forEach((el) => {
      el.addEventListener("pointerdown", () => el.classList.add("is-pressed"));
      ["pointerup", "pointerleave", "blur"].forEach((ev) => el.addEventListener(ev, () => el.classList.remove("is-pressed")));
    });
  </script>
</body>
</html>
